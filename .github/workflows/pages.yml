# Veroeffentlicht die Website auf GitHub Pages.
# Der Schritt "configure-pages" mit enablement: true schaltet Pages beim
# ersten Lauf selbst ein, es muss nichts in den Repository-Einstellungen
# geklickt werden.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Nur die Website-Dateien einsammeln
        run: |
          mkdir -p _site
          cp -r assets _site/
          cp *.html robots.txt sitemap.xml site.webmanifest _site/
          touch _site/.nojekyll

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
